name: Peru GitHub Rankings
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
concurrency:
  group: peru-ranking-refresh
  cancel-in-progress: false
jobs:
  release:
    name: GitHub Active Users
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.CUSTOM_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Record history refresh checkpoint
        id: history_checkpoint
        run: printf 'base=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: gayanvoice/top-github-users-action@master
        env:
          CUSTOM_TOKEN: ${{ secrets.CUSTOM_TOKEN }}
      # The upstream action regenerates docs/index.html as a world map.
      # Restore our Peru dashboard and refresh its public data after each update.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify history storage
        run: python3 scripts/test-history.py
      - name: Capture ranking history
        env:
          HISTORY_REFRESH_BASE: ${{ steps.history_checkpoint.outputs.base }}
        run: python3 scripts/capture-history.py --refresh-base "$HISTORY_REFRESH_BASE"
      - name: Build Peru dashboard
        run: |
          python3 scripts/build-site.py
          python3 scripts/test-seo.py --static-only
      - name: Save refreshed dashboard
        run: |
          git add -A -- docs README.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update Peru dashboard and ranking history'
            git push
          fi
